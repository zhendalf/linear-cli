name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate GraphQL code
        run: bun run codegen

      - name: Build
        run: bun run build

      - name: Publish to npm
        run: bun publish --access public
        env:
          # bun publish reads the token from NPM_CONFIG_TOKEN; store it as the
          # conventional NPM_TOKEN repo secret.
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
