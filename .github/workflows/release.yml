name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance via OIDC trusted publishing

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate GraphQL code
        run: bun run codegen

      - name: Lint and format check
        run: bunx biome check .

      - name: Type check
        run: bun x tsc --noEmit

      - name: Run tests
        run: bun test

      - name: Smoke-run the CLI
        run: |
          bun src/main.ts --version
          bun src/main.ts --help

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The package ships TypeScript source; generated GraphQL types
      # (src/__codegen__) are gitignored, so generate them before publishing.
      # (prepublishOnly also runs this as a safety net for manual publishes.)
      - name: Generate GraphQL code
        run: bun run codegen

      # Keyless publish via OIDC trusted publishing (no NPM_TOKEN needed) with a
      # provenance attestation. Triggered when a GitHub Release is published.
      # Requires a trusted publisher to be configured for @zhendalf/linear-cli on
      # npmjs.com pointing at this repo + workflow.
      - name: Publish to npm
        run: npm publish --provenance --access public
