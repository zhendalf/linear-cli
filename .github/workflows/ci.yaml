name: CI

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate GraphQL code
        run: bun run codegen

      - name: Lint and format check
        run: bunx biome check .

      - name: Type check
        run: bun x tsc --noEmit

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      # NOTE: skill-docs generation (`bun run generate-skill-docs`) is intentionally
      # NOT run in CI — run it manually when command help text changes:
      #   LINEAR_CLI="node dist/main.js" bun run generate-skill-docs

  node-parity:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate GraphQL code
        run: bun run codegen

      - name: Build
        run: bun run build

      - name: Verify bin runs on Node (version)
        run: node dist/main.js --version

      - name: Verify bin runs on Node (help)
        run: node dist/main.js --help
