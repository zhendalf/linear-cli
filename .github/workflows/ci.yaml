name: CI

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate GraphQL code
        run: bun run codegen

      - name: Lint and format check
        run: bunx biome check .

      - name: Type check
        run: bun x tsc --noEmit

      - name: Run tests
        run: bun test

      - name: Smoke-run the CLI
        run: |
          bun src/main.ts --version
          bun src/main.ts --help

      # NOTE: skill-docs generation (`bun run generate-skill-docs`) is intentionally
      # NOT run in CI — run it manually when command help text changes:
      #   bun run generate-skill-docs
