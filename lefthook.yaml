# Fast checks on commit; the full test suite on push.
# (Running `bun test` in the parallel pre-commit group contends with the
# file-mutating biome step, so tests live in pre-push instead.)
pre-commit:
  parallel: true
  commands:
    lint-format:
      glob: "*.{ts,json,jsonc}"
      run: bunx biome check --write {staged_files}
      stage_fixed: true
    typecheck:
      run: bun x tsc --noEmit

pre-push:
  commands:
    # Strip the git environment before starting bun. Git exports GIT_DIR,
    # GIT_INDEX_FILE and friends to its hooks, and GIT_DIR overrides a child's
    # cwd, so the git fixtures in test/utils/{git,vcs}.test.ts would run their
    # `git init`/`commit`/`checkout -b` against this repository instead of their
    # temp directories. It has to happen out here: Bun cannot drop inherited
    # variables from inside the process. test/setup.ts hard-fails if any survive.
    test:
      run: sh -c 'unset $(env | sed -n "s/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p"); bun test'
